function editFood(id){let f=food(id)||{name:'',category:'autre',compat:'both',buy:40,final:40,buyState:'cru',finalState:'préparé',unit:'g',process:true,specialCold:null};showModal(id?'Modifier un aliment':'Ajouter un aliment',`<form class="formgrid" onsubmit="submitFood(event,${JSON.stringify(id||'')})"><label>Nom<input required class="input" name="name" value="${esc(f.name)}"></label><div class="grid2"><label>Catégorie<select name="category">${[['proteine','Protéines'],['feculent','Féculents'],['legume','Légumes'],['fromage','Fromages'],['autre','Autres']].map(([v,n])=>`<option value="${v}" ${f.category===v?'selected':''}>${n}</option>`).join('')}</select></label><label>Compatible avec<select name="compat">${[['both','Chaud et froid'],['chaud','Chaud seulement'],['froid','Froid seulement']].map(([v,n])=>`<option value="${v}" ${f.compat===v?'selected':''}>${n}</option>`).join('')}</select></label></div><div class="grid2"><label>Quantité à acheter<input required name="buy" class="input" type="number" min="0.01" step="any" value="${f.buy}"></label><label>Quantité dans la gamelle<input required name="final" class="input" type="number" min="0.01" step="any" value="${f.final}"></label><label>État à l'achat<input required name="buyState" class="input" value="${esc(f.buyState)}"></label><label>État final<input required name="finalState" class="input" value="${esc(f.finalState)}"></label><label>Unité<select name="unit"><option value="g" ${f.unit==='g'?'selected':''}>Grammes</option><option value="u" ${f.unit==='u'?'selected':''}>Unités</option></select></label><label>Préparation nécessaire<select name="process"><option value="yes" ${f.process?'selected':''}>Oui</option><option value="no" ${!f.process?'selected':''}>Non</option></select></label></div>${f.name==='Saumon'?`<label>Quantité d'achat pour le saumon froid (g)<input class="input" type="number" name="specialCold" value="${f.specialCold??120}"></label>`:''}<div class="notice">Un nouvel aliment génère automatiquement les combinaisons compatibles dans la bibliothèque. Un aliment modifié ne change pas les tirages déjà enregistrés.</div>${button('Enregistrer',"",'', 'type="submit"')}</form>`.replace('onclick=""',''))}
function submitFood(e,id){e.preventDefault();let z=Object.fromEntries(new FormData(e.target)),newF={id:id||uid(),name:z.name.trim(),category:z.category,compat:z.compat,buy:+z.buy,final:+z.final,buyState:z.buyState.trim(),finalState:z.finalState.trim(),unit:z.unit,process:z.process==='yes',specialCold:z.specialCold?+z.specialCold:null};if(!newF.name||newF.buy<=0||newF.final<=0)return alert('Quantités invalides.');if(data.foods.some(f=>f.id!==id&&f.name.toLowerCase()===newF.name.toLowerCase()))return alert('Cet aliment existe déjà.');if(id){let old=food(id);if(old){Object.assign(old,newF);closeModal();save();render();return}}data.foods.push(newF);let made=generateRecipes(newF);save();closeModal();render();alert(`Aliment ajouté. ${made} nouvelle(s) recette(s) générée(s).`)}
function generateRecipes(f){let created=0,existing=new Set(data.recipes.map(r=>r.type+'|'+r.ingredients.map(i=>i.foodId).sort().join(','))),templates=[...data.recipes];for(const r of templates){if(!compat(f,r.type)||f.category==='fromage'&&r.type==='chaud')continue;let candidates=[];if(f.category==='autre'){if(!r.ingredients.some(i=>i.foodId===f.id))candidates.push([...r.ingredients,{foodId:f.id,amount:f.final}]);}else{for(let j=0;j<r.ingredients.length;j++){let old=food(r.ingredients[j].foodId);if(old?.category!==f.category||old.id===f.id)continue;let arr=clone(r.ingredients);arr[j]={foodId:f.id,amount:f.final};candidates.push(arr)}}for(const ings of candidates){let key=r.type+'|'+ings.map(i=>i.foodId).sort().join(',');if(existing.has(key))continue;existing.add(key);let name=ings.map(i=>food(i.foodId)?.name||'').filter(Boolean).join(', ');data.recipes.push({id:uid(),name,type:r.type,ingredients:ings,generated:true});created++}}return created}
function deleteFood(id){let f=food(id),affected=data.recipes.filter(r=>r.ingredients.some(i=>i.foodId===id));if(!f||!confirm(`Supprimer « ${f.name} » et ses ${affected.length} recette(s) associée(s) ? Le tirage actuel restera intact.`))return;data.foods=data.foods.filter(a=>a.id!==id);data.recipes=data.recipes.filter(r=>!affected.some(a=>a.id===r.id));save();render()}
function viewRecipe(id){let r=recipe(id);if(!r)return;showModal(r.name,`<p><span class="pill ${r.type==='froid'?'cold':''}">${r.type}</span></p>${r.ingredients.map(i=>{let f=food(i.foodId),c=f&&choiceState(f,r.type);return `<div class="line row"><strong>${esc(f?.name||'Absent')}</strong><span>${fmt(i.amount)} ${f?.unit==='u'?'œuf(s)':'g'} (${esc(c?.finalState||'')})<div class="sub">Achat : ${fmt(amountBuy(i,r.type))} ${f?.unit==='u'?'œuf(s)':'g'} (${esc(c?.buyState||'')})</div></span></div>`}).join('')}${button('Modifier',`closeModal();editRecipe('${r.id}')`)}`)}
function editRecipe(id){let r=recipe(id)||{name:'',type:'chaud',ingredients:[]};showModal(id?'Modifier une recette':'Nouvelle recette',`<form class="formgrid" onsubmit="submitRecipe(event,${JSON.stringify(id||'')})"><label>Nom de la recette<input required name="name" class="input" value="${esc(r.name)}"></label><label>Type<select name="type" id="recipeKind" onchange="drawIngredientEditor()"><option value="chaud" ${r.type==='chaud'?'selected':''}>Chaude</option><option value="froid" ${r.type==='froid'?'selected':''}>Froide</option></select></label><div id="ingredientEditor"></div><div class="actionrow">${button('+ Ingrédient','addIngredient()','secondary','type="button"')}${button('Enregistrer','','','type="submit"')}</div></form>`.replaceAll('onclick=""',''));window.editIngredients=clone(r.ingredients);drawIngredientEditor()}
function drawIngredientEditor(){let type=document.getElementById('recipeKind')?.value;if(!type)return;document.getElementById('ingredientEditor').innerHTML=window.editIngredients.map((i,j)=>`<div class="line grid2"><label>Aliment<select onchange="window.editIngredients[${j}].foodId=this.value;drawIngredientEditor()">${data.foods.filter(f=>compat(f,type)||f.id===i.foodId).map(f=>`<option value="${f.id}" ${f.id===i.foodId?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label><label>Quantité finale (${food(i.foodId)?.unit==='u'?'unités':'g'})<input class="input" type="number" min="0.01" step="any" value="${i.amount}" oninput="window.editIngredients[${j}].amount=+this.value"></label>${button('Retirer',`window.editIngredients.splice(${j},1);drawIngredientEditor()`,'danger','type="button"')}</div>`).join('')||'<p>Ajoute des ingrédients.</p>'}function addIngredient(){let type=document.getElementById('recipeKind').value,f=data.foods.find(x=>compat(x,type));if(!f)return alert('Aucun aliment compatible.');window.editIngredients.push({foodId:f.id,amount:f.final});drawIngredientEditor()}
function submitRecipe(e,id){e.preventDefault();let z=Object.fromEntries(new FormData(e.target)),ings=window.editIngredients;if(!ings.length||ings.some(i=>!food(i.foodId)||!(i.amount>0))||new Set(ings.map(i=>i.foodId)).size!==ings.length)return alert('Vérifie les ingrédients, leurs quantités et les doublons.');if(ings.some(i=>!compat(food(i.foodId),z.type)))return alert('Un ingrédient n’est pas compatible avec ce type de recette.');let r={id:id||uid(),name:z.name.trim(),type:z.type,ingredients:clone(ings),generated:false};if(id){let old=recipe(id);if(old)Object.assign(old,r)}else data.recipes.push(r);save();closeModal();render()}function deleteRecipe(id){let r=recipe(id);if(r&&confirm(`Supprimer « ${r.name} » ? Le tirage actuel restera intact.`)){data.recipes=data.recipes.filter(a=>a.id!==id);save();render()}}
function editWeight(){let d=new Date();let today=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');showModal('Ajouter une pesée',`<form class="formgrid" onsubmit="submitWeight(event)"><label>Date<input required class="input" type="date" name="date" value="${today}"></label><label>Poids (kg)<input required class="input" name="value" type="number" min="1" max="500" step="0.1" placeholder="Ex. 85,4"></label>${button('Enregistrer','','','type="submit"')}</form>`.replaceAll('onclick=""',''))}function submitWeight(e){e.preventDefault();let z=Object.fromEntries(new FormData(e.target)),v=+z.value;if(!(v>0&&v<=500))return alert('Poids invalide.');let old=data.weights.find(x=>x.date===z.date);if(old&&!confirm('Une pesée existe déjà à cette date. La remplacer ?'))return;if(old)old.value=v;else data.weights.push({id:uid(),date:z.date,value:v});save();closeModal();render()}function deleteWeight(id){if(confirm('Supprimer cette pesée ?')){data.weights=data.weights.filter(x=>x.id!==id);save();render()}}
function exportData(){let blob=new Blob([JSON.stringify({format:'GamellUp',version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='gamellup-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}function importData(){let i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{try{let obj=JSON.parse(await i.files[0].text()),d=obj.data||obj;if(!Array.isArray(d.foods)||!Array.isArray(d.recipes)||!Array.isArray(d.weights||[]))throw Error('format');if(!confirm('Remplacer toutes tes données actuelles par cette sauvegarde ?'))return;data=d;data.weights??=[];data.shopChecked??={};data.shopManual??=[];save();closeModal();render();alert('Sauvegarde restaurée.')}catch{alert('Fichier JSON invalide ou incompatible.')}};i.click()}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
render();
</script></body></html>
